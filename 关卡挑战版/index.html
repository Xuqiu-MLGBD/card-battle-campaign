<!-- 设置抽屉：**我们自己的模态**（2026-10-05）。上游那套纹章装饰

     而 styles.css 已出列 —— 留着它就会变成"默认显示 + 左上角一堆裸文字"（用户拍到的正是这个）。
     这里只保留界面层要用的 id：`#gamemenu` / `#gamemenuContent` / `#gamemenuTitle`
     （"导出本局信息"按钮挂进标题）与两颗按钮 Concede / Resume。 -->

<div id="gamemenuContent">

  <button id="resumebutton">继续对局</button>
  <button id="mainmenubutton">退出到主菜单</button>
  <button id="backnativebutton">返回原生界面</button>
</div>
</div>
<div id="contents">
<body oncontextmenu="return false" id="body">
  <div id="game" class="game">

    </div>

  </div>

  </div>

  <div class="computer-card-slot card-slot"></div>
  <div class="player-deck deck" id="playerDeck"></div>
  <div class="player-card-slot card-slot"></div>

  <div><div></div></div>
  <div>

  </div>
    </div>
  </div>

      <div></div>

    </div>
  </div>

<div class="board board--player"></div>
    </div>
  </div>
  <div id="innercursor"></div>

  <svg id="svg" width="100%" height="100%">
